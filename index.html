<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Security-related meta (defense in depth; real headers are set at the
         hosting layer — see vercel.json / netlify.toml / public/_headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />

    <title>
      FitMonk — Honey, Dry Fruits, Muesli, Talbina, Dates &amp; Omani Barfi
    </title>
    <meta
      name="description"
      content="FitMonk sells raw honey, premium dry fruits, muesli, talbina, dates and Omani barfi — natural, minimally processed pantry staples."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="FitMonk — Natural Honey, Dates, Talbina &amp; More"
    />
    <meta
      property="og:description"
      content="Raw honey, dry fruits, muesli, talbina, dates and Omani barfi, made the traditional way."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
